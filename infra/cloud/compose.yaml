name: know-engine
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1280m
    cpus: 1.25
    ports:
      - 127.0.0.1:19200:9200
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    logging:
      options:
        max-size: 5m
        max-file: "2"
  objects:
    image: docker.1ms.run/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: [mini, -dir=/data, -ip=127.0.0.1, -ip.bind=0.0.0.0, -s3.port=8333, -admin.ui=false, -master.volumeSizeLimitMB=128, -volume.max=0]
    env_file: config/s3.env
    mem_limit: 320m
    cpus: 0.5
    ports:
      - 127.0.0.1:19090:8333
    volumes:
      - object-data:/data
    restart: unless-stopped
    logging:
      options:
        max-size: 5m
        max-file: "2"
volumes:
  elasticsearch-data:
  object-data:

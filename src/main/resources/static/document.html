<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档管理</title>
    <link rel="stylesheet" href="/common.css">
    <style>
        .doc-title { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .doc-desc { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ke-text-muted); }
        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            min-width: 168px;
            max-width: 200px;
        }
        .action-btns .btn-xs {
            min-height: 26px;
            padding: 0 6px;
            font-size: 11px;
            font-weight: 550;
            width: 100%;
        }
        .btn-info {
            background: #0b6e99;
            color: #fff;
        }
        .btn-info:hover:not(:disabled) {
            background: #095a7d;
        }
        .toolbar-meta {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--ke-text-muted);
        }
        .table-split-notice {
            display: none;
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: var(--ke-radius-sm);
            border: 1px solid #b7d4ef;
            background: #eef6fc;
            color: var(--ke-text-secondary);
            font-size: var(--ke-font-base);
            line-height: 1.6;
        }
        .table-split-notice.is-visible {
            display: block;
        }
        .table-split-notice strong {
            color: var(--ke-text);
        }
        .segment-list { margin-top: 16px; }
        .segment-item {
            border: 1px solid var(--ke-border);
            border-radius: var(--ke-radius-sm);
            padding: 12px 16px;
            margin-bottom: 10px;
            background: var(--ke-surface-muted);
            transition: border-color 0.15s;
        }
        .segment-item:hover { border-color: var(--ke-primary); }
        .segment-item.segment-parent { border-left: 4px solid #185fa5; background: #f3f8ff; }
        .segment-item.segment-child { border-left: 4px solid #9a3412; background: #fff8f3; }
        .segment-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .segment-item-meta { font-size: var(--ke-font-sm); color: var(--ke-text-muted); display: flex; gap: 12px; }
        .segment-item-text {
            font-size: var(--ke-font-base);
            color: var(--ke-text);
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 120px;
            overflow: hidden;
        }
        .segment-item-text.expanded { max-height: none; }
        .segment-actions { display: flex; gap: 6px; }
        .segment-toggle { font-size: var(--ke-font-sm); color: var(--ke-primary); cursor: pointer; margin-top: 4px; }
        .checkbox-cell { width: 40px; text-align: center; }
        input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .json-viewer {
            background: #1a2332;
            color: #d6dee8;
            border-radius: var(--ke-radius-sm);
            padding: 16px;
            font-family: var(--ke-mono);
            font-size: 13px;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        .json-empty { color: var(--ke-text-muted); text-align: center; padding: 20px; font-size: var(--ke-font-base); }
    </style>
</head>
<body>
    <div class="app-page">
        <header class="app-nav">
            <div class="app-brand">
                <span class="brand-mark">KE</span>
                <h1>文档管理</h1>
            </div>
            <nav class="app-nav-links" aria-label="页面导航">
                <a href="/upload.html" class="nav-link">上传文档</a>
                <a href="/document.html" class="nav-link is-active">文档管理</a>
                <a href="/chat.html" class="nav-link">AI 对话</a>
            </nav>
        </header>

        <main class="app-main">
            <div class="filter-bar">
                <div class="filter-item">
                    <label>文档标题</label>
                    <input type="text" id="filterTitle" placeholder="模糊搜索">
                </div>
                <div class="filter-item">
                    <label>状态</label>
                    <select id="filterStatus">
                        <option value="">全部</option>
                        <option value="ACTIVE">已生效</option>
                        <option value="DRAFT">未发布</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="searchDocuments()">搜索</button>
                <button class="btn btn-success" onclick="resetFilter()">重置</button>
                <button class="btn btn-danger" onclick="batchDelete()">批量删除</button>
            </div>

            <div class="toolbar-meta" id="totalCount"></div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="checkbox-cell"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                            <th>ID</th>
                            <th>文档标题</th>
                            <th>状态</th>
                            <th>描述</th>
                            <th>版本</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="docTableBody">
                        <tr><td colspan="8"><div class="empty-state">加载中...</div></td></tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" id="pagination">
                <button onclick="changePage(currentPage-1)" id="prevBtn">上一页</button>
                <span class="page-info" id="pageInfo">1 / 1</span>
                <button onclick="changePage(currentPage+1)" id="nextBtn">下一页</button>
            </div>
        </main>
    </div>

    <!-- 文档编辑弹窗 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="editModalTitle">编辑文档</h2>
                <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editDocId">
                <input type="hidden" id="editLockVersion" value="0">
                <div class="form-group">
                    <label>文档标题 *</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="form-group">
                    <label>文档描述</label>
                    <textarea id="editDesc" placeholder="请输入文档描述"></textarea>
                </div>
            </form>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('editModal')">取消</button>
                <button class="btn btn-primary" onclick="saveDocument()">保存</button>
            </div>
        </div>
    </div>

    <!-- 分段查看弹窗 -->
    <div class="modal-overlay" id="segmentModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h2>分段列表 <span id="segmentDocTitle" style="font-size:14px;color:#888;"></span></h2>
                <button class="modal-close" onclick="closeModal('segmentModal')">&times;</button>
            </div>
            <div class="toolbar">
                <div class="toolbar-left">
                    <span id="segmentCount" style="font-size:14px;color:#666;"></span>
                </div>
                <div class="toolbar-right">
                    <button class="btn btn-sm btn-primary" onclick="changeSegmentPage(segmentCurrentPage-1)" id="segPrevBtn">上一页</button>
                    <span class="page-info" id="segPageInfo">1 / 1</span>
                    <button class="btn btn-sm btn-primary" onclick="changeSegmentPage(segmentCurrentPage+1)" id="segNextBtn">下一页</button>
                </div>
            </div>
            <div class="segment-list" id="segmentList">
                <div class="empty-state">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 文档扩展信息弹窗 -->
    <div class="modal-overlay" id="extensionModal">
        <div class="modal">
            <div class="modal-header">
                <h2>扩展信息 <span id="extDocTitle" style="font-size:14px;color:#888;"></span></h2>
                <button class="modal-close" onclick="closeModal('extensionModal')">&times;</button>
            </div>
            <div id="extensionContent">
                <div class="json-empty">加载中...</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('extensionModal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 分段 Meta 信息弹窗 -->
    <div class="modal-overlay" id="segmentMetaModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Meta 信息 <span id="metaSegId" style="font-size:14px;color:#888;"></span></h2>
                <button class="modal-close" onclick="closeModal('segmentMetaModal')">&times;</button>
            </div>
            <div id="segmentMetaContent">
                <div class="json-empty">加载中...</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('segmentMetaModal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 上传新版本弹窗 -->
    <div class="modal-overlay" id="versionModal">
        <div class="modal">
            <div class="modal-header">
                <h2>上传新版本 <span id="versionDocTitle" style="font-size:14px;color:#888;"></span></h2>
                <button class="modal-close" onclick="closeModal('versionModal')">&times;</button>
            </div>
            <form id="versionForm">
                <input type="hidden" id="versionDocId">
                <div class="form-group">
                    <label>新版本号 *</label>
                    <input type="text" id="versionNumber" required placeholder="请输入版本号，如 2.0.0" pattern="^\d+\.\d+\.\d+$">
                </div>
                <div class="form-group">
                    <label>版本变更说明</label>
                    <input type="text" id="versionChangelog" placeholder="可选，描述此版本的变更内容">
                </div>
                <div class="form-group">
                    <label>选择文件 *</label>
                    <input type="file" id="versionFile" required>
                </div>
            </form>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('versionModal')">取消</button>
                <button class="btn btn-success" onclick="submitVersion()">上传新版本</button>
            </div>
        </div>
    </div>

    <!-- 版本列表弹窗 -->
    <div class="modal-overlay" id="versionListModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h2>版本列表 <span id="versionListTitle" style="font-size:14px;color:#888;"></span></h2>
                <button class="modal-close" onclick="closeModal('versionListModal')">&times;</button>
            </div>
            <div id="versionListContent">
                <div class="empty-state">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 版本上传后切片弹窗 -->
    <div class="modal-overlay" id="versionSplitModal">
        <div class="modal">
            <div class="modal-header">
                <h2>📄 文档切片设置 <span id="versionSplitTitle" style="font-size:14px;color:#888;"></span></h2>
                <button class="modal-close" onclick="closeModal('versionSplitModal')">&times;</button>
            </div>
            <form id="versionSplitForm">
                <input type="hidden" id="versionSplitDocId">
                <input type="hidden" id="versionSplitVersionId">
                <div class="table-split-notice" id="versionTableSplitNotice">
                    <strong>表格文件固定处理：</strong>XLSX / CSV 会按「首行表头 + 逐行键值对」切分，每行生成一个分段。无需也不支持选择 LENGTH / TITLE 等切分方式。
                </div>
                <div id="versionSplitParamsPanel">
                    <div class="form-group">
                        <label>切片方式 *</label>
                        <select id="versionSplitType" required>
                            <option value="">请选择切片方式</option>
                            <option value="LENGTH">按长度切分 (LENGTH)</option>
                            <option value="TITLE">按标题切分 (TITLE)</option>
                            <option value="REGEX">按正则切分 (REGEX)</option>
                            <option value="SMART">智能切分 (SMART)</option>
                            <option value="SEPARATOR">按分隔符切分 (SEPARATOR)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>最大分段长度 *</label>
                        <input type="number" id="versionSplitChunkSize" placeholder="例如：500" min="1" required>
                        <div class="param-hint">所有切分方式都需要此参数</div>
                    </div>
                    <div class="param-group" id="versionSplitOverlapGroup">
                        <div class="form-group">
                            <label>分段重叠长度</label>
                            <input type="number" id="versionSplitOverlap" placeholder="例如：50" min="0">
                            <div class="param-hint">按长度切分、按标题切分需要</div>
                        </div>
                    </div>
                    <div class="param-group" id="versionSplitTitleLevelGroup">
                        <div class="form-group">
                            <label>标题级数</label>
                            <input type="number" id="versionSplitTitleLevel" placeholder="例如：3" min="1" max="6">
                            <div class="param-hint">按标题切分需要，范围1-6</div>
                        </div>
                    </div>
                    <div class="param-group" id="versionSplitRegexGroup">
                        <div class="form-group">
                            <label>正则表达式</label>
                            <input type="text" id="versionSplitRegex" placeholder="例如：\n\n+">
                            <div class="param-hint">按正则切分需要</div>
                        </div>
                    </div>
                    <div class="param-group" id="versionSplitSeparatorGroup">
                        <div class="form-group">
                            <label>分隔符</label>
                            <input type="text" id="versionSplitSeparator" placeholder="例如：\n\n">
                            <div class="param-hint">按分隔符切分需要</div>
                        </div>
                    </div>
                </div>
            </form>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('versionSplitModal')">跳过</button>
                <button class="btn btn-primary" id="versionSplitBtn" onclick="submitVersionSplit()">开始切片</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== 状态管理 =====
        let currentPage = 1;
        let pageSize = 10;
        let totalPages = 1;
        let totalRecords = 0;
        let selectedIds = new Set();
        let docRecords = []; // 存储当前页文档数据，供 onclick 查找标题
        // 分段相关
        let segmentDocId = null;
        let segmentVersionId = null; // 当前查看的版本ID（null 表示查看生效版本）
        let segmentCurrentPage = 1;
        let segmentPageSize = 10;
        let segmentTotalPages = 1;

        // ===== 工具函数 =====
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            setTimeout(() => t.className = 'toast', 2500);
        }

        function formatTime(timeStr) {
            if (!timeStr) return '-';
            const d = new Date(timeStr);
            if (isNaN(d)) return timeStr;
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function escapeHtml(text) {
            if (text == null) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        // 状态枚举中文映射（参考 DocumentStatus / IndexStatus）
        const STATUS_MAP = {
            ACTIVE: '已生效',
            DRAFT: '未发布',
            UPLOADING: '待上传',
            UPLOADED: '等待解析',
            CONVERTED: '已解析',
            CHUNKED: '已切片',
            PENDING: '正在构建索引',
            READY: '索引就绪'
        };

        function statusTag(status) {
            if (!status) return '<span class="tag tag-init">-</span>';
            const cls = status.toLowerCase().replace(/_/g, '_');
            const label = STATUS_MAP[status] || status;
            return `<span class="tag tag-${cls}">${label}</span>`;
        }

        // ===== 文档列表 =====
        async function loadDocuments() {
            const params = new URLSearchParams();
            params.append('current', currentPage);
            params.append('size', pageSize);
            const title = document.getElementById('filterTitle').value.trim();
            const status = document.getElementById('filterStatus').value;
            if (title) params.append('docTitle', title);
            if (status) params.append('status', status);

            try {
                const res = await fetch(`/api/document/page?${params}`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const page = await res.json();
                totalPages = page.pages || 1;
                totalRecords = page.total || 0;
                renderTable(page.records || []);
                renderPagination();
                document.getElementById('totalCount').textContent = `共 ${totalRecords} 条记录`;
                selectedIds.clear();
                document.getElementById('selectAll').checked = false;
            } catch (e) {
                showToast('加载文档列表失败: ' + e.message, 'error');
                document.getElementById('docTableBody').innerHTML = '<tr><td colspan="8"><div class="empty-state">加载失败</div></td></tr>';
            }
        }

        function renderTable(records) {
            docRecords = records || [];
            if (!records || records.length === 0) {
                document.getElementById('docTableBody').innerHTML = '<tr><td colspan="8"><div class="empty-state">暂无数据</div></td></tr>';
                return;
            }
            const html = records.map(doc => `
                <tr>
                    <td class="checkbox-cell"><input type="checkbox" value="${doc.docId}" onchange="toggleSelect(${doc.docId})" ${selectedIds.has(doc.docId) ? 'checked' : ''}></td>
                    <td>${doc.docId}</td>
                    <td class="doc-title" title="${escapeHtml(doc.docTitle)}">${escapeHtml(doc.docTitle)}</td>
                    <td>${statusTag(doc.activeVersionId ? 'ACTIVE' : 'DRAFT')}</td>
                    <td class="doc-desc" title="${escapeHtml(doc.description)}">${escapeHtml(doc.description || '-')}</td>
                    <td id="versionCell-${doc.docId}" style="min-width:90px;">
                        <span style="color:#999;font-size:13px;">加载中...</span>
                    </td>
                    <td style="white-space:nowrap;">${formatTime(doc.createdAt)}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn btn-xs btn-primary" onclick="viewSegments(${doc.docId})">查看分段</button>
                            <button class="btn btn-xs btn-info" onclick="openEditModal(${doc.docId})">编辑</button>
                            <button class="btn btn-xs btn-success" onclick="openVersionModal(${doc.docId})">上传新版本</button>
                            <button class="btn btn-xs btn-danger" onclick="deleteDocument(${doc.docId})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
            document.getElementById('docTableBody').innerHTML = html;
            // 异步加载版本信息
            loadVersionInfoForTable(records);
        }

        // 分别显示已生效的修订和更新的草稿。
        async function loadVersionInfoForTable(records) {
            await Promise.all(records.map(async (doc) => {
                try {
                    const res = await fetch(`/api/document/versions/${doc.docId}`);
                    if (res.ok) {
                        const versions = await res.json();
                        const cell = document.getElementById(`versionCell-${doc.docId}`);
                        if (!cell) return;
                        const active = versions.find(v => v.active)?.revision;
                        const draft = versions.find(v => !v.active)?.revision;
                        const activeLabel = active ? '生效 v' + escapeHtml(active.version) : '暂无生效版';
                        const draftLabel = draft && (!active || draft.versionId > active.versionId)
                            ? ' · v' + escapeHtml(draft.version) + ' ' + versionState(draft) : '';
                        cell.innerHTML = '<button class="btn btn-xs btn-secondary" onclick="viewVersions(' + doc.docId + ')">'
                            + activeLabel + draftLabel + '</button>';
                    }
                } catch (e) { /* ignore */ }
            }));
        }

        function renderPagination() {
            document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        function searchDocuments() { currentPage = 1; loadDocuments(); }
        function resetFilter() {
            document.getElementById('filterTitle').value = '';
            document.getElementById('filterStatus').value = '';
            currentPage = 1;
            loadDocuments();
        }
        function changePage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadDocuments();
        }

        // ===== 选择 =====
        function toggleSelect(id) {
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            const checkboxes = document.querySelectorAll('#docTableBody input[type=checkbox]');
            document.getElementById('selectAll').checked = [...checkboxes].every(cb => cb.checked);
        }
        function toggleSelectAll() {
            const checked = document.getElementById('selectAll').checked;
            document.querySelectorAll('#docTableBody input[type=checkbox]').forEach(cb => {
                cb.checked = checked;
                const id = parseInt(cb.value);
                if (checked) selectedIds.add(id); else selectedIds.delete(id);
            });
        }

        // ===== 新增/编辑 =====
        async function openEditModal(docId) {
            try {
                const res = await fetch('/api/document/' + docId);
                if (!res.ok) throw new Error(await res.text());
                const doc = await res.json();
                document.getElementById('editDocId').value = doc.docId;
                document.getElementById('editLockVersion').value = doc.lockVersion;
                document.getElementById('editTitle').value = doc.docTitle;
                document.getElementById('editDesc').value = doc.description || '';
                openModal('editModal');
            } catch (error) {
                showToast('加载文档失败：' + error.message, 'error');
            }
        }

        async function saveDocument() {
            const data = {
                docId: Number(document.getElementById('editDocId').value),
                lockVersion: Number(document.getElementById('editLockVersion').value),
                docTitle: document.getElementById('editTitle').value.trim(),
                description: document.getElementById('editDesc').value.trim()
            };
            try {
                const res = await fetch('/api/document', {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error(await res.text());
                closeModal('editModal');
                loadDocuments();
                showToast('更新成功');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function deleteDocument(docId) {
            if (!confirm('确认删除该文档？删除后将同时删除其下所有分段。')) return;
            try {
                const res = await fetch(`/api/document/${docId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const result = await res.json();
                if (result) { showToast('删除成功'); loadDocuments(); }
                else showToast('删除失败', 'error');
            } catch (e) {
                showToast('删除失败: ' + e.message, 'error');
            }
        }

        async function batchDelete() {
            if (selectedIds.size === 0) { showToast('请先选择要删除的文档', 'error'); return; }
            if (!confirm(`确认删除选中的 ${selectedIds.size} 个文档？将同时删除其下所有分段。`)) return;
            const ids = [...selectedIds].join(',');
            try {
                const res = await fetch(`/api/document/batch?ids=${ids}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const result = await res.json();
                if (result) { showToast('批量删除成功'); loadDocuments(); }
                else showToast('批量删除失败', 'error');
            } catch (e) {
                showToast('批量删除失败: ' + e.message, 'error');
            }
        }

        // ===== 版本管理 =====
        async function openVersionModal(docId) {
            const doc = docRecords.find(d => d.docId === docId);
            const docTitle = doc ? (doc.docTitle || '') : '';
            document.getElementById('versionDocTitle').textContent = `- ${docTitle}`;
            document.getElementById('versionDocId').value = docId;
            document.getElementById('versionNumber').value = '';
            document.getElementById('versionChangelog').value = '';
            document.getElementById('versionFile').value = '';

            // 获取已有版本列表，自动建议下一个版本号
            try {
                const res = await fetch(`/api/document/versions/${docId}`);
                if (res.ok) {
                    const versions = await res.json();
                    if (versions.length > 0) {
                        // 版本列表已按降序排序，取第一个为最新版本
                        const latestVersion = versions[0].revision.version;
                        // 主版本号 +1 作为建议版本
                        const parts = latestVersion.split('.');
                        const nextMajor = parseInt(parts[0]) + 1;
                        document.getElementById('versionNumber').value = `${nextMajor}.0.0`;
                    } else {
                        document.getElementById('versionNumber').value = '1.0.0';
                    }
                }
            } catch (e) { /* ignore */ }

            openModal('versionModal');
        }

        async function submitVersion() {
            const docId = document.getElementById('versionDocId').value;
            const version = document.getElementById('versionNumber').value;
            const changelog = document.getElementById('versionChangelog').value.trim();
            const fileInput = document.getElementById('versionFile');

            if (!version || !/^\d+\.\d+\.\d+$/.test(version)) { showToast('请输入有效的版本号（如 2.0.0）', 'error'); return; }
            if (!fileInput.files || !fileInput.files[0]) { showToast('请选择文件', 'error'); return; }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('docId', docId);
            formData.append('version', version);
            if (changelog) formData.append('changelog', changelog);

            try {
                const res = await fetch('/api/document/upload-version', {
                    method: 'POST',
                    body: formData
                });
                if (!res.ok) {
                    const errText = await res.text();
                    showToast(errText || '上传失败', 'error');
                    return;
                }
                const doc = await res.json();
                showToast(`新版本 v${version} 上传成功`);
                closeModal('versionModal');
                // 弹出切片设置弹窗；表格文件按扩展名隐藏无用切分参数
                openVersionSplitModal(doc, fileInput.files[0].name);
            } catch (e) {
                showToast('上传失败: ' + e.message, 'error');
            }
        }

        function versionState(v) {
            if (v.lastError) return v.nextRetryAt ? '失败，等待自动重试' : '处理失败';
            if (v.indexStatus === 'READY') return '索引就绪';
            if (v.indexStatus === 'PENDING') return '正在构建索引';
            if (v.buildStatus === 'CONVERTED' && v.splitParam) return '等待切片';
            return STATUS_MAP[v.buildStatus] || v.buildStatus;
        }

        let versionRows = [];
        async function viewVersions(docId) {
            document.getElementById('versionListTitle').textContent = ' · 文档 #' + docId;
            const list = document.getElementById('versionListContent');
            list.textContent = '加载中…';
            openModal('versionListModal');
            try {
                const res = await fetch('/api/document/versions/' + docId);
                if (!res.ok) throw new Error(await res.text());
                versionRows = await res.json();
                list.innerHTML = versionRows.map(({revision: v, active, docUrl}, i) => {
                    const retry = v.lastError && v.buildStatus !== 'UPLOADING'
                        ? '<button class="btn btn-xs btn-primary" onclick="retryVersion(' + docId + ',' + v.versionId + ')">重试</button>' : '';
                    const build = !v.splitParam && ['UPLOADED', 'CONVERTED'].includes(v.buildStatus)
                        ? '<button class="btn btn-xs btn-primary" onclick="configureVersion(' + i + ')">设置切片</button>' : '';
                    const publish = !active && v.indexStatus === 'READY'
                        ? '<button class="btn btn-xs btn-primary" onclick="switchVersion(' + docId + ',' + v.versionId + ')">设为生效</button>' : '';
                    const view = v.buildStatus === 'CHUNKED'
                        ? '<button class="btn btn-xs btn-secondary" onclick="viewSegmentsFromVersion(' + docId + ',' + v.versionId + ')">查看分段</button>' : '';
                    const download = docUrl && /^https?:\/\//.test(docUrl)
                        ? '<a class="btn btn-xs btn-secondary" href="' + escapeHtml(docUrl).replaceAll('"', '&quot;') + '" target="_blank" rel="noopener">原文件</a>' : '';
                    return '<div style="padding:12px;border-bottom:1px solid #ddd"><strong>v' + escapeHtml(v.version)
                        + '</strong> · ' + (active ? '生效中' : escapeHtml(versionState(v)))
                        + (v.changelog ? '<div>' + escapeHtml(v.changelog) + '</div>' : '')
                        + (v.lastError ? '<div style="color:#b42318">' + escapeHtml(v.lastError) + '</div>' : '')
                        + '<div style="display:flex;gap:8px;margin-top:8px">' + build + retry + publish + view + download + '</div></div>';
                }).join('') || '暂无版本';
                list.insertAdjacentHTML('afterbegin', '<button class="btn btn-xs btn-secondary" onclick="viewVersions(' + docId + ')">刷新进度</button>');
            } catch (error) {
                list.textContent = error.message;
            }
        }

        function configureVersion(i) {
            const v = versionRows[i].revision;
            closeModal('versionListModal');
            openVersionSplitModal(v, v.sourceObjectKey || '');
        }

        async function retryVersion(docId, versionId) {
            const res = await fetch('/api/document/versions/' + versionId + '/retry', { method: 'POST' });
            if (!res.ok) { showToast(await res.text(), 'error'); return; }
            showToast('已提交重试');
            viewVersions(docId);
        }

        async function switchVersion(docId, versionId) {
            const confirmMsg = '切换版本后需要重新切片，旧版本数据将在新版本向量化完成后自动清理。确认切换？';
            if (!confirm(confirmMsg)) return;
            try {
                const res = await fetch(`/api/document/switch-version?docId=${docId}&versionId=${versionId}`, { method: 'POST' });
                if (!res.ok) {
                    const errText = await res.text();
                    showToast(errText || '切换失败', 'error');
                    return;
                }
                const doc = await res.json();
                showToast('版本切换成功');
                closeModal('versionListModal');
                // 刷新文档列表
                loadDocuments();
            } catch (e) {
                showToast('切换失败: ' + e.message, 'error');
            }
        }

        // ===== 分段查看 =====
        async function viewSegments(docId) {
            const doc = docRecords.find(d => d.docId === docId);
            const docTitle = doc ? (doc.docTitle || '') : '';
            segmentDocId = docId;
            segmentVersionId = doc ? (doc.activeVersionId || null) : null;
            segmentCurrentPage = 1;
            document.getElementById('segmentDocTitle').textContent = `- ${docTitle}`;
            openModal('segmentModal');
            await loadSegmentCount();
            await loadSegments();
        }

        /**
         * 从版本列表弹窗点击「查看分段」时调用，按指定版本过滤分段
         * @param {number} docId        文档ID
         * @param {number} versionId    版本ID
         * @param {string} versionLabel 版本显示标签（如 "v2.0.0"）
         */
        async function viewSegmentsFromVersion(docId, versionId, versionLabel = '版本 #' + versionId) {
            segmentDocId = docId;
            segmentVersionId = versionId;
            segmentCurrentPage = 1;
            document.getElementById('segmentDocTitle').textContent = ` ${versionLabel}`;
            openModal('segmentModal');
            await loadSegmentCount();
            await loadSegments();
        }

        async function loadSegmentCount() {
            try {
                const params = new URLSearchParams();
                params.append('documentId', segmentDocId);
                if (segmentVersionId != null) params.append('versionId', segmentVersionId);
                const res = await fetch(`/api/segment/count-by-document?${params}`);
                if (res.ok) {
                    const count = await res.json();
                    document.getElementById('segmentCount').textContent = `共 ${count} 个分段`;
                }
            } catch (e) { /* ignore */ }
        }

        async function loadSegments() {
            const params = new URLSearchParams();
            params.append('documentId', segmentDocId);
            if (segmentVersionId != null) params.append('versionId', segmentVersionId);
            params.append('current', segmentCurrentPage);
            params.append('size', segmentPageSize);
            try {
                const res = await fetch(`/api/segment/page-by-document?${params}`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const page = await res.json();
                segmentTotalPages = page.pages || 1;
                renderSegments(page.records || []);
                document.getElementById('segPageInfo').textContent = `${segmentCurrentPage} / ${segmentTotalPages}`;
                document.getElementById('segPrevBtn').disabled = segmentCurrentPage <= 1;
                document.getElementById('segNextBtn').disabled = segmentCurrentPage >= segmentTotalPages;
            } catch (e) {
                document.getElementById('segmentList').innerHTML = `<div class="empty-state">加载失败: ${e.message}</div>`;
            }
        }

        function renderSegments(records) {
            if (!records || records.length === 0) {
                document.getElementById('segmentList').innerHTML = '<div class="empty-state">暂无分段数据</div>';
                return;
            }
            const html = records.map(seg => {
                const meta = parseMetadata(seg.metadata);
                const segTags = getSegmentTypeTags(seg, meta);
                return `
                <div class="segment-item ${segTags.itemClass}">
                    <div class="segment-item-header">
                        <div class="segment-item-meta">
                            <span>#${seg.chunkOrder ?? seg.id}</span>
                            ${seg.versionId ? `<span class="tag" style="background:#f3e5f5;color:#7b1fa2;">版本#${seg.versionId}</span>` : ''}
                            <span>${seg.embeddingId ? 'Embedding: ' + escapeHtml(seg.embeddingId) : ''}</span>
                            ${segTags.tagHtml}
                        </div>
                        <div class="segment-actions">
                            <button class="btn btn-sm btn-success" onclick="viewSegmentMeta(${seg.id})">Meta</button>
                        </div>
                    </div>
                    <div class="segment-item-text" id="segText${seg.id}">${escapeHtml(seg.text)}</div>
                    <div class="segment-toggle" onclick="toggleSegmentText(${seg.id})">展开/收起</div>
                </div>
                `;
            }).join('');
            document.getElementById('segmentList').innerHTML = html;
        }

        // 解析 metadata JSON 字符串
        function parseMetadata(metadataStr) {
            if (!metadataStr) return {};
            try {
                return JSON.parse(metadataStr);
            } catch (e) {
                return {};
            }
        }

        // 根据分段属性和 metadata 判断分段类型，返回标签 HTML 和样式类
        function getSegmentTypeTags(seg, meta) {
            const tags = [];
            const classes = [];

            // 父分段：skipEmbedding=1，存储完整文本但不参与向量检索
            if (seg.skipEmbedding === 1 || seg.skipEmbedding === '1') {
                tags.push('<span class="tag tag-parent">父分段</span>');
                classes.push('segment-parent');
            }

            // 子分段：metadata 中有 parentChunkId
            if (meta.parentChunkId) {
                tags.push('<span class="tag tag-child">子分段</span>');
                if (!classes.includes('segment-parent')) {
                    classes.push('segment-child');
                }
            }

            return { tagHtml: tags.join(' '), itemClass: classes.join(' ') };
        }

        function toggleSegmentText(id) {
            const el = document.getElementById('segText' + id);
            if (el) el.classList.toggle('expanded');
        }

        function changeSegmentPage(page) {
            if (page < 1 || page > segmentTotalPages) return;
            segmentCurrentPage = page;
            loadSegments();
        }

        // ===== 分段编辑 =====
        async function viewExtension(docId) {
            const doc = docRecords.find(d => d.docId === docId);
            const docTitle = doc ? (doc.docTitle || '') : '';
            document.getElementById('extDocTitle').textContent = `- ${docTitle}`;
            document.getElementById('extensionContent').innerHTML = '<div class="json-empty">加载中...</div>';
            openModal('extensionModal');
            try {
                const res = await fetch(`/api/document/${docId}`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const doc = await res.json();
                renderJson('extensionContent', doc.extension);
            } catch (e) {
                document.getElementById('extensionContent').innerHTML = `<div class="json-empty">加载失败: ${escapeHtml(e.message)}</div>`;
            }
        }

        // ===== 分段 Meta 信息 =====
        async function viewSegmentMeta(segId) {
            document.getElementById('metaSegId').textContent = `- #${segId}`;
            document.getElementById('segmentMetaContent').innerHTML = '<div class="json-empty">加载中...</div>';
            openModal('segmentMetaModal');
            try {
                const res = await fetch(`/api/segment/${segId}`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const seg = await res.json();
                renderJson('segmentMetaContent', seg.metadata);
            } catch (e) {
                document.getElementById('segmentMetaContent').innerHTML = `<div class="json-empty">加载失败: ${escapeHtml(e.message)}</div>`;
            }
        }

        // JSON 格式化展示（使用 textContent 防 XSS）
        function renderJson(containerId, jsonStr) {
            const container = document.getElementById(containerId);
            if (!jsonStr) {
                container.innerHTML = '<div class="json-empty">暂无数据</div>';
                return;
            }
            const pre = document.createElement('pre');
            pre.className = 'json-viewer';
            try {
                const parsed = JSON.parse(jsonStr);
                pre.textContent = JSON.stringify(parsed, null, 2);
            } catch (e) {
                pre.textContent = jsonStr;
            }
            container.innerHTML = '';
            container.appendChild(pre);
        }

        // ===== 通用 =====
        function openModal(id) {
            const el = document.getElementById(id);
            const openCount = document.querySelectorAll('.modal-overlay.show').length;
            el.style.zIndex = String(1000 + (openCount + 1) * 10);
            el.classList.add('show');
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            el.classList.remove('show');
            el.style.zIndex = '';
        }

        // ===== 版本上传后切片 =====
        const TABLE_SPLIT_DEFAULTS = { splitType: 'LENGTH', chunkSize: '500', overlap: '0' };
        let versionSplitIsTableMode = false;

        function getFileExtension(fileName) {
            if (!fileName) return '';
            const idx = fileName.lastIndexOf('.');
            return idx >= 0 ? fileName.substring(idx + 1).toLowerCase() : '';
        }

        function isTableFile(fileName) {
            const ext = getFileExtension(fileName);
            return ext === 'xlsx' || ext === 'xls' || ext === 'csv';
        }

        function openVersionSplitModal(doc, uploadedFileName) {
            document.getElementById('versionSplitForm').reset();
            document.getElementById('versionSplitVersionId').value = doc.versionId;
            document.getElementById('versionSplitDocId').value = doc.docId;
            document.getElementById('versionSplitTitle').textContent = doc.docTitle ? `- ${doc.docTitle}` : '';
            // 隐藏所有参数组
            ['versionSplitOverlapGroup', 'versionSplitTitleLevelGroup', 'versionSplitRegexGroup', 'versionSplitSeparatorGroup']
                .forEach(id => document.getElementById(id).classList.remove('show'));

            versionSplitIsTableMode = isTableFile(uploadedFileName);
            const notice = document.getElementById('versionTableSplitNotice');
            const paramsPanel = document.getElementById('versionSplitParamsPanel');
            notice.classList.toggle('is-visible', versionSplitIsTableMode);
            paramsPanel.style.display = versionSplitIsTableMode ? 'none' : 'block';

            if (versionSplitIsTableMode) {
                document.getElementById('versionSplitType').value = TABLE_SPLIT_DEFAULTS.splitType;
                document.getElementById('versionSplitChunkSize').value = TABLE_SPLIT_DEFAULTS.chunkSize;
                document.getElementById('versionSplitOverlap').value = TABLE_SPLIT_DEFAULTS.overlap;
            } else if (doc.extension) {
                // 从 extension 中解析上次分段参数并回显
                try {
                    const ext = JSON.parse(doc.extension);
                    if (ext.splitParam) {
                        const sp = ext.splitParam;
                        if (sp.splitType) document.getElementById('versionSplitType').value = sp.splitType;
                        if (sp.chunkSize) document.getElementById('versionSplitChunkSize').value = sp.chunkSize;
                        if (sp.overlap != null) document.getElementById('versionSplitOverlap').value = sp.overlap;
                        if (sp.titleLevel != null) document.getElementById('versionSplitTitleLevel').value = sp.titleLevel;
                        if (sp.regex) document.getElementById('versionSplitRegex').value = sp.regex;
                        if (sp.separator) document.getElementById('versionSplitSeparator').value = sp.separator;
                        // 触发 change 事件以显示/隐藏对应参数组
                        document.getElementById('versionSplitType').dispatchEvent(new Event('change'));
                    }
                } catch (e) { /* ignore */ }
            }

            openModal('versionSplitModal');
        }

        document.getElementById('versionSplitType').addEventListener('change', function() {
            if (versionSplitIsTableMode) return;
            const splitType = this.value;
            ['versionSplitOverlapGroup', 'versionSplitTitleLevelGroup', 'versionSplitRegexGroup', 'versionSplitSeparatorGroup']
                .forEach(id => document.getElementById(id).classList.remove('show'));
            if (splitType === 'LENGTH' || splitType === 'TITLE') {
                document.getElementById('versionSplitOverlapGroup').classList.add('show');
            }
            if (splitType === 'TITLE') {
                document.getElementById('versionSplitTitleLevelGroup').classList.add('show');
            }
            if (splitType === 'REGEX') {
                document.getElementById('versionSplitRegexGroup').classList.add('show');
            }
            if (splitType === 'SEPARATOR') {
                document.getElementById('versionSplitSeparatorGroup').classList.add('show');
            }
        });

        async function submitVersionSplit() {
            const docId = document.getElementById('versionSplitDocId').value;
            const versionId = document.getElementById('versionSplitVersionId').value;
            let splitType = document.getElementById('versionSplitType').value;
            let chunkSize = document.getElementById('versionSplitChunkSize').value;
            let overlap = document.getElementById('versionSplitOverlap').value || 0;
            let titleLevel = document.getElementById('versionSplitTitleLevel').value || '';
            let regex = document.getElementById('versionSplitRegex').value || '';
            let separator = document.getElementById('versionSplitSeparator').value || '';

            if (versionSplitIsTableMode) {
                splitType = TABLE_SPLIT_DEFAULTS.splitType;
                chunkSize = TABLE_SPLIT_DEFAULTS.chunkSize;
                overlap = TABLE_SPLIT_DEFAULTS.overlap;
                titleLevel = '';
                regex = '';
                separator = '';
            } else {
                if (!splitType) { showToast('请选择切片方式', 'error'); return; }
                if (!chunkSize || chunkSize < 1) { showToast('请输入有效的最大分段长度', 'error'); return; }
            }

            const params = new URLSearchParams({ versionId });
            params.append('splitType', splitType);
            params.append('chunkSize', chunkSize);
            params.append('overlap', overlap);
            params.append('titleLevel', titleLevel);
            params.append('regex', regex);
            params.append('separator', separator);

            const btn = document.getElementById('versionSplitBtn');
            btn.disabled = true;
            btn.textContent = '切片中...';

            try {
                const res = await fetch(`/api/document/split/${docId}?${params.toString()}`, { method: 'POST' });
                if (res.ok) {
                    showToast('已提交构建，完成后自动发布');
                    closeModal('versionSplitModal');
                    versionSplitIsTableMode = false;
                    loadDocuments();
                } else {
                    const errText = await res.text();
                    showToast(errText || '切片失败', 'error');
                }
            } catch (e) {
                showToast('切片失败: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '开始切片';
            }
        }
        // 点击遮罩关闭弹窗
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(overlay.id); });
        });
        // 回车搜索
        document.getElementById('filterTitle').addEventListener('keydown', e => { if (e.key === 'Enter') searchDocuments(); });

        // 初始化：加载文档列表
        loadDocuments();
    </script>
</body>
</html>

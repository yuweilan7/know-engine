<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手</title>
    <!-- Markdown 渲染依赖：marked 解析 + DOMPurify 防 XSS + highlight.js 代码高亮 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <link rel="stylesheet" href="/common.css">
    <link rel="stylesheet" href="/chat.css">
</head>
<body>
    <div class="app-page app-page--fill">
        <header class="app-nav">
            <div class="app-brand">
                <span class="brand-mark">KE</span>
                <h1>AI 对话助手</h1>
            </div>
            <nav class="app-nav-links" aria-label="页面导航">
                <a href="/upload.html" class="nav-link">上传文档</a>
                <a href="/document.html" class="nav-link">文档管理</a>
                <a href="/chat.html" class="nav-link is-active">AI 对话</a>
            </nav>
        </header>
        <main class="app-main app-main--flush">
            <div class="chat-layout">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <button class="btn btn-primary new-chat-btn" id="newChatBtn">新对话</button>
                    </div>
                    <div class="conversation-list" id="conversationList">
                        <div class="no-conversations">暂无对话记录</div>
                    </div>
                </div>
                <div class="chat-main">
                    <div class="chat-header" id="chatHeader" style="display: none;">
                        <h3 id="chatTitle">新对话</h3>
                        <span class="conversation-id" id="conversationIdDisplay"></span>
                    </div>

                    <div class="messages-container" id="messagesContainer">
                        <div class="welcome-message" id="welcomeMessage">
                            <h2>欢迎使用 AI 对话助手</h2>
                            <p>输入您的问题，开始与 AI 交流吧！</p>
                        </div>
                    </div>

                    <div class="input-area">
                        <div class="input-wrapper">
                            <textarea id="messageInput" placeholder="输入您的问题..." rows="1"></textarea>
                            <button class="btn btn-primary" id="sendBtn">发送</button>
                            <button class="btn" id="stopBtn" hidden>停止</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/chat-stream.js"></script>
    <script>
        // 状态管理
        let currentConversationId = new URLSearchParams(location.search).get('conversationId');
        let activeRequest = null;
        let loadSequence = 0;

        // 配置 marked：开启 GFM、换行符转 <br>、代码高亮
        if (window.marked) {
            marked.setOptions({
                gfm: true,
                breaks: true,
                highlight: function(code, lang) {
                    if (window.hljs) {
                        try {
                            if (lang && hljs.getLanguage(lang)) {
                                return hljs.highlight(code, { language: lang }).value;
                            }
                            return hljs.highlightAuto(code).value;
                        } catch (e) { /* ignore */ }
                    }
                    return code;
                }
            });
        }

        // Markdown 渲染（先经 marked 解析，再用 DOMPurify 清理，防 XSS）
        function renderMarkdown(text) {
            if (text == null) return '';
            const raw = String(text);
            if (!window.marked) return escapeHtml(raw);
            try {
                const html = marked.parse(raw);
                if (window.DOMPurify) {
                    return DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
                }
                return html;
            } catch (e) {
                console.error('Markdown 渲染失败:', e);
                return escapeHtml(raw);
            }
        }

        // DOM 元素
        const newChatBtn = document.getElementById('newChatBtn');
        const conversationList = document.getElementById('conversationList');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const chatHeader = document.getElementById('chatHeader');
        const chatTitle = document.getElementById('chatTitle');
        const conversationIdDisplay = document.getElementById('conversationIdDisplay');

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            setupEventListeners();
            const initialConversation = currentConversationId;
            await loadConversations();
            if (initialConversation && currentConversationId === initialConversation && !activeRequest) {
                await loadMessages(initialConversation);
            }
        });

        // 设置事件监听
        function setupEventListeners() {
            // 新对话按钮
            newChatBtn.addEventListener('click', () => {
                leaveConversation();
                loadSequence++;
                setConversationId(null);
                resetChat();
            });

            // 发送按钮
            sendBtn.addEventListener('click', sendMessage);
            stopBtn.addEventListener('click', stopCurrent);
            window.addEventListener('pagehide', leaveConversation);

            // 回车发送
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // 自动调整输入框高度
            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
            });
        }

        // 加载会话列表
        async function loadConversations() {
            try {
                const response = await fetch('/chat/conversation/list');
                if (response.ok) {
                    const result = await response.json();
                    renderConversationList(result.data || []);
                }
            } catch (error) {
                console.error('加载会话列表失败:', error);
            }
        }

        // 渲染会话列表
        function renderConversationList(conversations) {
            if (!conversations || conversations.length === 0) {
                conversationList.innerHTML = '<div class="no-conversations">暂无对话记录</div>';
                return;
            }

            conversationList.innerHTML = conversations.map(conv => `
                <div class="conversation-item ${conv.conversationId === currentConversationId ? 'active' : ''}" 
                     data-id="${conv.conversationId}">
                    <div class="title">${escapeHtml(conv.title || '新对话')}</div>
                    <div class="time">${formatTime(conv.updatedAt || conv.createdAt)}</div>
                    <button class="delete-btn" onclick="deleteConversation(event, '${conv.conversationId}')">删除</button>
                </div>
            `).join('');

            // 添加点击事件
            conversationList.querySelectorAll('.conversation-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-btn')) return;
                    selectConversation(item.dataset.id);
                });
            });
        }

        // 选择会话
        async function selectConversation(conversationId) {
            if (conversationId === currentConversationId && activeRequest) return;
            leaveConversation();
            setConversationId(conversationId);
            
            // 更新UI选中状态
            conversationList.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.toggle('active', item.dataset.id === conversationId);
            });

            // 加载消息历史
            await loadMessages(conversationId);
        }

        function setConversationId(id) {
            currentConversationId = id;
            const url = new URL(location.href);
            if (id) url.searchParams.set('conversationId', id);
            else url.searchParams.delete('conversationId');
            history.replaceState(null, '', url);
        }

        // 加载消息历史
        async function loadMessages(conversationId) {
            const load = ++loadSequence;
            try {
                const response = await fetch(`/chat/message/list?conversationId=${encodeURIComponent(conversationId)}`);
                if (response.ok) {
                    const result = await response.json();
                    if (load !== loadSequence || currentConversationId !== conversationId) return;
                    renderMessages(result.data || []);
                    
                    // 显示聊天头部
                    const activeItem = conversationList.querySelector('.conversation-item.active');
                    if (activeItem) {
                        chatTitle.textContent = activeItem.querySelector('.title').textContent;
                    }
                    conversationIdDisplay.textContent = conversationId.substring(0, 8) + '...';
                    chatHeader.style.display = 'flex';
                    messagesContainer.querySelector('.welcome-message')?.remove();
                }
            } catch (error) {
                console.error('加载消息失败:', error);
            }
        }

        // 渲染消息列表
        function renderMessages(messages) {
            if (!messages || messages.length === 0) {
                messagesContainer.innerHTML = '<div class="welcome-message"><p>暂无消息记录</p></div>';
                return;
            }

            messagesContainer.innerHTML = messages.map(msg => {
                const refsHtml = msg.ragReferences && msg.ragReferences.length > 0
                    ? buildReferencesHtml(msg.ragReferences)
                    : '';
                const isUser = msg.type === 'USER';
                // AI 消息按 Markdown 渲染（支持图片等），用户消息保持原文转义
                const bodyHtml = isUser
                    ? escapeHtml(msg.content || '')
                    : `<div class="markdown-body">${renderMarkdown(msg.content || '')}</div>`;
                return `
                    <div class="message ${isUser ? 'user' : 'assistant'}">
                        <div class="message-avatar">${isUser ? 'U' : 'AI'}</div>
                        <div class="message-content">
                            <div class="message-text">${bodyHtml}</div>
                            ${refsHtml}
                            ${!isUser && msg.status ? '<div class="run-status">' + escapeHtml(runLabel(msg.status, msg.reasonCode)) + '</div>' : ''}
                            <div class="message-time">${formatTime(msg.createdAt)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            scrollToBottom();
        }


        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || activeRequest) return;
            if (new TextEncoder().encode(content).length > 4096) {
                alert('问题超过 4096 字节，请缩短后再发送');
                return;
            }
            loadSequence++;
            appendMessage('user', content);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            messagesContainer.querySelector('.welcome-message')?.remove();
            chatHeader.style.display = 'flex';
            const request = {
                command: {clientRequestId: crypto.randomUUID(), conversationId: currentConversationId, content},
                element: appendMessage('assistant', '', true),
                controller: new AbortController(),
                answer: '', sequence: 0, stopped: false, terminal: false
            };
            activeRequest = request;
            setStreaming(true);
            try {
                const options = {method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(request.command), signal: AbortSignal.timeout(8000)};
                let created;
                try {
                    created = await fetch('/chat/runs', options);
                } catch (error) {
                    created = await fetch('/chat/runs', {...options, signal: AbortSignal.timeout(8000)});
                }
                requireOk(created);
                request.run = await created.json();
                if (activeRequest === request) {
                    setConversationId(request.run.conversationId);
                    conversationIdDisplay.textContent = currentConversationId.slice(0, 8) + '...';
                    loadConversations();
                }
                if (request.stopped) {
                    await cancelRequest(request);
                    return;
                }
                const response = await fetch(runUrl(request, '/events'), {
                    headers: {'Accept': 'text/event-stream'}, signal: request.controller.signal
                });
                if (response.status === 429) {
                    await cancelRequest(request, '当前回答并发已满，请稍后重发');
                    return;
                }
                requireOk(response);
                await readChatEvents(response.body, event => receiveEvent(request, event));
                if (!request.terminal && !request.stopped) await reconcile(request, '回答连接已断开');
            } catch (error) {
                if (request.stopped) {
                    if (request.cancelPromise) await request.cancelPromise;
                    else if (!request.run) setRunLabel(request, '未确认轮次创建，未打开回答流');
                } else if (request.run) {
                    await reconcile(request, '回答连接失败');
                } else {
                    setRunLabel(request, '发送失败：' + error.message);
                }
            } finally {
                if (activeRequest === request) {
                    activeRequest = null;
                    setStreaming(false);
                    removeTypingIndicator(request.element);
                    request.element.querySelector('.progress-spinner')?.remove();
                    loadConversations();
                }
            }
        }

        function receiveEvent(request, event) {
            if (activeRequest !== request || request.stopped || request.terminal
                    || event.runId !== request.run.runId || event.sequence <= request.sequence) return;
            request.sequence = event.sequence;
            const payload = event.payload;
            switch (event.type) {
                case 'progress':
                case 'warning':
                    updateProgressStatus(request.element, payload.message);
                    break;
                case 'references':
                    renderReferences(request.element, payload.references);
                    break;
                case 'delta':
                    if (!request.answer) markAllProgressDone(request.element);
                    request.answer += payload.text;
                    updateMessageContent(request.element, request.answer);
                    break;
                case 'end':
                    request.terminal = payload.persisted;
                    setRunLabel(request, runLabel(payload.status, payload.reasonCode));
                    break;
                case 'error':
                    setRunLabel(request, '终态保存尚未确认，正在查询');
                    break;
            }
        }

        function setStreaming(streaming) {
            sendBtn.disabled = streaming;
            stopBtn.hidden = !streaming;
            stopBtn.disabled = false;
        }

        function stopCurrent() {
            const request = activeRequest;
            if (!request || request.terminal) return;
            request.stopped = true;
            stopBtn.disabled = true;
            setRunLabel(request, '正在停止…');
            if (request.run) cancelRequest(request);
        }

        function leaveConversation() {
            const request = activeRequest;
            if (!request) return;
            stopCurrent();
            activeRequest = null;
            setStreaming(false);
        }

        function runUrl(request, suffix = '') {
            return '/chat/runs/' + encodeURIComponent(request.run.runId) + suffix;
        }

        function cancelRequest(request, label) {
            if (!request.cancelPromise) request.cancelPromise = (async () => {
                let fallback = '已停止接收，后台状态待确认';
                try {
                    const response = await fetch(runUrl(request, '/cancel'), {
                        method: 'POST', keepalive: true, signal: AbortSignal.timeout(5000)
                    });
                    requireOk(response);
                    const state = await response.json();
                    if (state.accepted) fallback = '已请求停止，正在保存';
                } catch (error) {
                    console.debug('停止请求状态待确认', error);
                } finally {
                    request.controller.abort();
                }
                await reconcile(request, fallback, label);
            })();
            return request.cancelPromise;
        }

        async function reconcile(request, fallback, label) {
            for (let attempt = 0; attempt < 6 && activeRequest === request; attempt++) {
                try {
                    const response = await fetch(runUrl(request), {signal: AbortSignal.timeout(1800)});
                    requireOk(response);
                    const state = await response.json();
                    if (activeRequest !== request) return;
                    if (typeof state.answer === 'string' && state.answer.length >= request.answer.length) {
                        request.answer = state.answer;
                        updateMessageContent(request.element, request.answer);
                    }
                    if (state.references) renderReferences(request.element, state.references);
                    const status = state.run.status;
                    if (['COMPLETED', 'CANCELLED', 'FAILED', 'TIMED_OUT'].includes(status)) {
                        request.terminal = true;
                        setRunLabel(request, label || runLabel(status, state.reasonCode));
                        return;
                    }
                } catch (error) {
                    console.debug('轮次状态暂不可查', error);
                }
                setRunLabel(request, label || fallback);
                await new Promise(resolve => setTimeout(resolve, 500));
            }
        }

        function requireOk(response) {
            if (response.ok) return;
            const labels = {400: '请求内容无效', 404: '会话不存在', 409: '会话有活动轮次或轮次已开始',
                410: '会话已删除', 429: '服务繁忙，请稍后重试'};
            throw new Error(labels[response.status] || ('HTTP ' + response.status));
        }

        function setRunLabel(request, text) {
            if (activeRequest !== request) return;
            const content = request.element.querySelector('.message-content');
            let label = content.querySelector('.run-status');
            if (!label) {
                label = document.createElement('div');
                label.className = 'run-status';
                label.setAttribute('role', 'status');
                content.append(label);
            }
            label.textContent = text;
        }

        function runLabel(status, reason) {
            const labels = {READY: '等待开始', RUNNING: '生成中', FINALIZING: '正在保存', CANCELLED: '已停止',
                TIMED_OUT: '回答超时', FAILED: '回答失败'};
            const details = {NOT_STARTED: '未打开回答流', RETRIEVAL_UNAVAILABLE: '知识检索不可用',
                UPSTREAM_PROTOCOL: '模型流中断', UPSTREAM_INTERRUPTED: '模型连接中断',
                OUTPUT_LIMIT: '达到输出限制', CONTENT_FILTER: '模型未返回可显示的回答',
                FIRST_ANSWER_TIMEOUT: '等待首字超时', STREAM_IDLE_TIMEOUT: '输出中断超时',
                PERSISTENCE_UNAVAILABLE: '保存失败', RECOVERY_INCOMPLETE: '进程中断，已保留最近保存内容',
                SLOW_CONSUMER: '接收速度过慢', EMPTY_ANSWER: '模型返回空回答'};
            if (status === 'COMPLETED') return reason === 'NO_EVIDENCE' ? '已完成 · 资料不足' : '已完成';
            return (labels[status] || '') + (details[reason] ? ' · ' + details[reason] : '');
        }

        // 添加消息到聊天区域
        function appendMessage(type, content, showTyping = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            // AI 消息按 Markdown 渲染，用户消息保持转义
            const bodyHtml = type === 'user'
                ? escapeHtml(content)
                : `<div class="markdown-body">${renderMarkdown(content)}</div>`;
            messageDiv.innerHTML = `
                <div class="message-avatar">${type === 'user' ? 'U' : 'AI'}</div>
                <div class="message-content">
                    <div class="message-text">${bodyHtml}${showTyping ? '<div class="typing-indicator"><span></span><span></span><span></span></div>' : ''}</div>
                    <div class="message-time">${new Date().toLocaleTimeString()}</div>
                </div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        // 更新消息内容
        function updateMessageContent(messageElement, content) {
            const textElement = messageElement.querySelector('.message-text');
            if (textElement) {
                // 保留打字指示器
                const typingIndicator = textElement.querySelector('.typing-indicator');
                const isAssistant = messageElement.classList.contains('assistant');
                if (isAssistant) {
                    // 流式过程中也按 Markdown 渲染（图片、代码块、表格等增量也能正确呈现）
                    textElement.innerHTML = `<div class="markdown-body">${renderMarkdown(content)}</div>`;
                } else {
                    textElement.innerHTML = escapeHtml(content);
                }
                if (typingIndicator) {
                    textElement.appendChild(typingIndicator);
                }
            }
            scrollToBottom();
        }

        // 构建引用资料HTML
        function buildReferencesHtml(references) {
            if (!references || references.length === 0) return '';
            const uniqueRefs = [];
            const seen = new Set();
            for (const ref of references) {
                const key = JSON.stringify([ref.documentId || ref.documentTitle, ref.versionId || ref.url]);
                if (!seen.has(key)) {
                    seen.add(key);
                    uniqueRefs.push(ref);
                }
            }
            return `
                <div class="message-references">
                    <div class="references-label">提供给模型的参考来源</div>
                    <div class="references-list">
                        ${uniqueRefs.map((ref, idx) => `
                            <a href="${escapeHtml(referenceUrl(ref.url))}" target="_blank" rel="noopener noreferrer" class="reference-item" title="${escapeHtml(ref.documentTitle || '')}">
                                <span class="reference-index">[${idx + 1}]</span>
                                <span class="reference-title">${escapeHtml(ref.documentTitle || '未知文档')}</span>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 渲染引用资料到消息元素
        function renderReferences(messageElement, references) {
            const contentEl = messageElement.querySelector('.message-content');
            if (!contentEl) return;

            // 移除已有的引用区域
            const existingRefs = contentEl.querySelector('.message-references');
            if (existingRefs) existingRefs.remove();

            const refsHtml = buildReferencesHtml(references);
            if (!refsHtml) return;

            // 插入到 message-time 之前
            const timeEl = contentEl.querySelector('.message-time');
            if (timeEl) {
                timeEl.insertAdjacentHTML('beforebegin', refsHtml);
            } else {
                contentEl.insertAdjacentHTML('beforeend', refsHtml);
            }
        }

        // 移除打字指示器
        function removeTypingIndicator(messageElement) {
            const typingIndicator = messageElement.querySelector('.typing-indicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // 更新进度状态：依次展示所有进度，新进度到来时将上一个标记为已完成
        function updateProgressStatus(messageElement, progressMsg) {
            const contentEl = messageElement.querySelector('.message-content');
            if (!contentEl) return;

            // 移除打字指示器（如果存在）
            removeTypingIndicator(messageElement);

            const steps = messageElement.progressSteps || [];
            // 将上一个进度标记为已完成
            if (steps.length > 0) {
                steps[steps.length - 1].done = true;
            }
            // 添加新进度
            steps.push({ msg: progressMsg, done: false });
            messageElement.progressSteps = steps;

            renderProgressList(contentEl, steps);
            scrollToBottom();
        }

        // 标记最后一个进度为已完成
        function markAllProgressDone(messageElement) {
            const contentEl = messageElement.querySelector('.message-content');
            if (!contentEl) return;
            const steps = messageElement.progressSteps || [];
            if (steps.length > 0) {
                steps[steps.length - 1].done = true;
                messageElement.progressSteps = steps;
                renderProgressList(contentEl, steps);
            }
        }

        // 渲染进度列表（始终插入到正文内容之前）
        function renderProgressList(contentEl, steps) {
            let listEl = contentEl.querySelector('.progress-list');
            if (!listEl) {
                listEl = document.createElement('div');
                listEl.className = 'progress-list';
            }
            listEl.innerHTML = steps.map(step => `
                <div class="progress-item ${step.done ? 'done' : 'active'}">
                    <span class="progress-icon">${step.done ? '✓' : '<div class="progress-spinner"></div>'}</span>
                    <span>${escapeHtml(step.msg)}</span>
                </div>
            `).join('');

            // 将进度列表插入到正文 .message-text 之前，确保正文输出在进度下方
            const textEl = contentEl.querySelector('.message-text');
            if (textEl) {
                contentEl.insertBefore(listEl, textEl);
            } else {
                contentEl.appendChild(listEl);
            }
        }

        function referenceUrl(value) {
            try {
                const url = new URL(value || '#', location.origin);
                return ['http:', 'https:'].includes(url.protocol) ? url.href : '#';
            } catch {
                return '#';
            }
        }
        // 重置聊天区域
        function resetChat() {
            messagesContainer.innerHTML = `
                <div class="welcome-message" id="welcomeMessage">
                    <h2>欢迎使用 AI 对话助手</h2>
                    <p>输入您的问题，开始与 AI 交流吧！</p>
                </div>
            `;
            chatHeader.style.display = 'none';
            chatTitle.textContent = '新对话';
            conversationIdDisplay.textContent = '';
        }

        // 删除会话
        async function deleteConversation(event, conversationId) {
            event.stopPropagation();
            
            if (!confirm('确定要删除这个对话吗？')) return;

            try {
                const response = await fetch(`/chat/conversation/delete?conversationId=${encodeURIComponent(conversationId)}`, {
                    method: 'DELETE'
                });

                requireOk(response);
                if (response.ok) {
                    const result = await response.json();
                    if (!result.success) {
                        alert(result.message || '删除失败');
                        return;
                    }
                    loadConversations();
                    if (currentConversationId === conversationId) {
                        setConversationId(null);
                        resetChat();
                    }
                }
            } catch (error) {
                console.error('删除会话失败:', error);
                alert('删除失败: ' + error.message);
            }
        }

        // 滚动到底部
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // 格式化时间
        function formatTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            
            return date.toLocaleDateString();
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

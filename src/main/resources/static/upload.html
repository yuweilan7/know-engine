<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识文档上传</title>
    <link rel="stylesheet" href="/common.css">
    <style>
        .upload-grid {
            max-width: 760px;
            margin-inline: auto;
        }
        .file-drop {
            position: relative;
            border: 1.5px dashed var(--ke-border-strong);
            border-radius: var(--ke-radius);
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            background: var(--ke-surface);
            transition: border-color 0.15s, background-color 0.15s;
        }
        .file-drop:hover,
        .file-drop.is-dragover {
            border-color: var(--ke-primary);
            background: var(--ke-primary-soft);
        }
        .file-drop input[type="file"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .file-drop-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            border-radius: 10px;
            background: var(--ke-primary-soft);
            color: var(--ke-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
        }
        .file-drop-text {
            color: var(--ke-text-secondary);
            font-size: var(--ke-font-base);
        }
        .file-drop-name {
            margin-top: 10px;
            color: var(--ke-primary);
            font-weight: 550;
            word-break: break-all;
            font-size: 13px;
        }
        .progress-container {
            display: none;
            margin-top: 16px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--ke-border);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--ke-primary);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            text-align: center;
            margin-top: 8px;
            color: var(--ke-text-secondary);
            font-size: var(--ke-font-base);
        }
        .result {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: var(--ke-radius-sm);
            display: none;
            border: 1px solid transparent;
        }
        .result.success {
            display: block;
            background: var(--ke-success-soft);
            color: var(--ke-success);
            border-color: #b7e0cb;
        }
        .result.error {
            display: block;
            background: var(--ke-danger-soft);
            color: var(--ke-danger);
            border-color: #f0b4ae;
        }
        .result-title {
            font-weight: 600;
            margin-bottom: 6px;
        }
        .result-content {
            font-size: var(--ke-font-base);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="app-page">
        <header class="app-nav">
            <div class="app-brand">
                <span class="brand-mark">KE</span>
                <h1>知识文档上传</h1>
            </div>
            <nav class="app-nav-links" aria-label="页面导航">
                <a href="/upload.html" class="nav-link is-active">上传文档</a>
                <a href="/document.html" class="nav-link">文档管理</a>
                <a href="/chat.html" class="nav-link">AI 对话</a>
            </nav>
        </header>

        <main class="app-main">
            <div class="upload-grid" id="uploadGrid">
                <section class="panel">
                    <h2 class="panel-title">上传文件</h2>
                    <form id="uploadForm">
                        <div class="form-group">
                            <label>选择文件 *</label>
                            <div class="file-drop" id="fileWrapper">
                                <input type="file" id="file" name="file" accept=".pdf,.doc,.docx,.md,.txt,.csv,.xls,.xlsx" required>
                                <div class="file-drop-icon">+</div>
                                <div class="file-drop-text">点击或拖拽文件到此处</div>
                                <div class="file-drop-name" id="fileName"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="title">文档标题 *</label>
                            <input type="text" id="title" name="title" placeholder="请输入文档标题" required>
                        </div>

                        <div class="form-group">
                            <label for="description">文档描述 *</label>
                            <input type="text" id="description" name="description" placeholder="请输入文档描述" required>
                        </div>

                        <div id="splitOptions"></div>
                        <p class="form-group param-hint">上传后自动处理，搜索索引通过核验后发布。</p>
                        <button type="submit" class="btn btn-primary btn-block" id="uploadBtn">上传并处理</button>
                    </form>

                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>

                    <div class="result" id="result">
                        <div class="result-title" id="resultTitle"></div>
                        <div class="result-content" id="resultContent"></div>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script src="/document-build.js"></script>
    <script>
        const fileInput = document.getElementById('file');
        const fileName = document.getElementById('fileName');
        const fileWrapper = document.getElementById('fileWrapper');
        const uploadForm = document.getElementById('uploadForm');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');
        const splitOptions = mountSplitOptions(document.getElementById('splitOptions'), fileInput);
        let trackingId = 0;

        fileInput.addEventListener('change', () => {
            const name = fileInput.files[0]?.name || '';
            fileName.textContent = name;
            const baseName = name.replace(/\.[^.]+$/, '');
            for (const id of ['title', 'description']) {
                const input = document.getElementById(id);
                if (!input.value.trim()) input.value = baseName;
            }
        });
        fileWrapper.addEventListener('dragover', event => {
            event.preventDefault();
            fileWrapper.classList.add('is-dragover');
        });
        fileWrapper.addEventListener('dragleave', () => fileWrapper.classList.remove('is-dragover'));
        fileWrapper.addEventListener('drop', event => {
            event.preventDefault();
            fileWrapper.classList.remove('is-dragover');
            if (event.dataTransfer.files.length !== 1) return;
            fileInput.files = event.dataTransfer.files;
            fileInput.dispatchEvent(new Event('change'));
        });

        function showResult(type, title, detail, docId) {
            result.className = 'result ' + type;
            resultTitle.textContent = title;
            resultContent.textContent = detail;
            if (docId) {
                const link = document.createElement('a');
                link.href = '/document.html?docId=' + encodeURIComponent(docId);
                link.textContent = '查看版本';
                resultContent.append(' · ', link);
            }
        }

        async function trackBuild(docId, versionId, token) {
            if (token !== trackingId) return;
            try {
                const res = await fetch('/api/document/versions/' + docId);
                if (!res.ok) throw new Error('无法读取处理进度');
                const versions = await res.json();
                if (token !== trackingId) return;
                const view = versions.find(({revision}) => revision.versionId === versionId);
                if (!view) throw new Error('版本已不存在');
                const { revision: v, active } = view;
                showResult(v.lastError ? 'error' : 'success', describeVersion(v, active),
                    v.lastError || `文档 #${docId} · v${v.version}`, docId);
                if (versionBuildPending(v, active)) setTimeout(() => trackBuild(docId, versionId, token), 3000);
            } catch (error) {
                if (token === trackingId) showResult('error', error.message, '可在版本列表刷新进度。', docId);
            }
        }

        uploadForm.addEventListener('submit', event => {
            event.preventDefault();
            const token = ++trackingId;
            const formData = new FormData(uploadForm);
            result.className = 'result';
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            progressContainer.style.display = 'block';
            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中…';

            const xhr = new XMLHttpRequest();
            xhr.upload.addEventListener('progress', event => {
                if (!event.lengthComputable) return;
                const percent = Math.round(event.loaded / event.total * 100) + '%';
                progressFill.style.width = percent;
                progressText.textContent = percent === '100%' ? '文件已传送，正在保存…' : percent;
            });
            xhr.addEventListener('load', () => {
                if (xhr.status < 200 || xhr.status >= 300) {
                    showResult('error', '提交失败', xhr.responseText || `HTTP ${xhr.status}`);
                    return;
                }
                const v = JSON.parse(xhr.responseText);
                showResult('success', '已接收，正在后台处理', `文档 #${v.docId} · v${v.version}`, v.docId);
                uploadForm.reset();
                fileName.textContent = '';
                splitOptions.update('');
                trackBuild(v.docId, v.versionId, token);
            });
            xhr.addEventListener('error', () => showResult('error', '提交失败', '请检查连接。'));
            xhr.addEventListener('loadend', () => {
                progressContainer.style.display = 'none';
                uploadBtn.disabled = false;
                uploadBtn.textContent = '上传并处理';
            });
            xhr.open('POST', '/api/document/upload');
            xhr.send(formData);
        });
    </script>
</body>
</html>
